name: Sincronizar avaliações do Google

on:
  schedule:
    # Todo dia às 07:00 (horário de Brasília = UTC-3 -> 10:00 UTC)
    - cron: "0 10 * * *"
  workflow_dispatch:   # permite rodar manualmente pela aba "Actions" do GitHub
    inputs:
      backfill_limit:
        description: >-
          Backfill manual (opcional): quantidade de avaliações mais recentes
          para buscar do zero, ignorando o que já foi sincronizado. Deixe em
          branco para uma sincronização normal (só o que é novo).
        required: false
        default: ""

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rodar sincronização com o Outscraper
        env:
          OUTSCRAPER_API_KEY: ${{ secrets.OUTSCRAPER_API_KEY }}
          PLACE_QUERY: ${{ vars.PLACE_QUERY }}
          REVIEWS_PATH: reviews.json
          # Rodada agendada (todo dia): usa 150 e sincronização incremental
          # normal. Rodada manual com "backfill_limit" preenchido: busca
          # essa quantidade mais recente do zero, ignorando o cutoff.
          REVIEWS_LIMIT: ${{ github.event.inputs.backfill_limit || '150' }}
          IGNORE_CUTOFF: ${{ github.event.inputs.backfill_limit != '' && 'true' || 'false' }}
          # Troque para "true" temporariamente se precisar depurar o
          # formato da resposta do Outscraper nos logs do Actions.
          DEBUG: "false"
        run: node scripts/sync-reviews.mjs

      - name: Commitar reviews.json se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reviews.json

          if git diff --cached --quiet; then
            echo "Nenhuma avaliação nova — nada para commitar."
            exit 0
          fi

          git commit -m "Sincroniza avaliações do Google [automático]"

          # A própria ferramenta (o index.html) grava direto no main via API
          # do GitHub sempre que alguém usa o sistema (novo lançamento,
          # confirmação, edição de funcionário etc.). Se isso acontecer perto
          # do horário desta sincronização, o "git push" simples é recusado
          # porque o main já mudou desde o checkout. Por isso, em caso de
          # rejeição, atualiza com o que mudou (rebase) e tenta de novo —
          # mesma lógica de "tentar de novo" que o index.html já usa
          # (writeWithRetry) para lidar com gravações concorrentes.
          tentativas=5
          for i in $(seq 1 $tentativas); do
            if git push; then
              echo "Push feito com sucesso (tentativa $i)."
              exit 0
            fi
            echo "Push rejeitado (tentativa $i de $tentativas) — o main mudou nesse meio tempo. Atualizando e tentando de novo..."
            git fetch origin main
            git rebase origin/main
            sleep 3
          done

          echo "Não foi possível dar push depois de $tentativas tentativas."
          exit 1
